<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H@d3$ // COLD STORAGE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- The Global CRT Scanline Shading -->
    <div class="crt-overlay"></div>

    <!-- THE HAUNTED LAB FRAMEWORK -->
    <main class="vault-container">
        
        <!-- Interactive Terminal Screen Space -->
        <div class="console-wrapper">
            <div id="terminal-history" class="terminal-log">
                <!-- Staggered boot logs and system messages print here -->
            </div>
            
            <!-- Active Input Form (Hidden until boot sequence finishes) -->
            <form id="terminal-form" class="input-line hidden">
                <span class="prompt-arrow">&gt;</span>
                <input type="text" id="terminal-input" autocomplete="off" autofocus spellcheck="false">
            </form>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
