<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" id="skeleton-puppet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Film grain filter -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended"/>
      <feComponentTransfer in="blended">
        <feFuncR type="linear" slope="0.85"/>
        <feFuncG type="linear" slope="0.85"/>
        <feFuncB type="linear" slope="0.85"/>
      </feComponentTransfer>
    </filter>

    <!-- Soft glow for bones (halation effect) -->
    <filter id="bone-glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- SKELETON GROUP - all parts positioned relative to this -->
  <g id="skel-root" filter="url(#grain)">

    <!-- ===================== -->
    <!--  LEFT LEG (back)      -->
    <!-- ===================== -->
    <g id="leg-left">
      <!-- thigh -->
      <ellipse id="ll-thigh" cx="88" cy="290" rx="10" ry="28" fill="#c8c8c8" stroke="#1a1a1a" stroke-width="1.5" rx="10" filter="url(#bone-glow)"/>
      <!-- knee joint -->
      <circle id="ll-knee" cx="88" cy="318" r="9" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="1.5"/>
      <!-- shin -->
      <ellipse id="ll-shin" cx="88" cy="344" rx="8" ry="24" fill="#c8c8c8" stroke="#1a1a1a" stroke-width="1.5" filter="url(#bone-glow)"/>
      <!-- foot -->
      <ellipse id="ll-foot" cx="82" cy="366" rx="14" ry="7" fill="#d0d0d0" stroke="#1a1a1a" stroke-width="1.5" rx="7"/>
    </g>

    <!-- ===================== -->
    <!--  RIGHT LEG (front)    -->
    <!-- ===================== -->
    <g id="leg-right">
      <ellipse id="rl-thigh" cx="112" cy="290" rx="10" ry="28" fill="#e0e0e0" stroke="#1a1a1a" stroke-width="1.5" filter="url(#bone-glow)"/>
      <circle id="rl-knee" cx="112" cy="318" r="9" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="1.5"/>
      <ellipse id="rl-shin" cx="112" cy="344" rx="8" ry="24" fill="#e0e0e0" stroke="#1a1a1a" stroke-width="1.5" filter="url(#bone-glow)"/>
      <ellipse id="rl-foot" cx="118" cy="366" rx="14" ry="7" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="1.5"/>
    </g>

    <!-- ===================== -->
    <!--  PELVIS               -->
    <!-- ===================== -->
    <ellipse id="pelvis" cx="100" cy="268" rx="22" ry="14" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/>

    <!-- ===================== -->
    <!--  SPINE                -->
    <!-- ===================== -->
    <!-- vertebrae as small stacked ovals for that rubber hose feel -->
    <ellipse cx="100" cy="250" rx="6" ry="5" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="1"/>
    <ellipse cx="100" cy="238" rx="6" ry="5" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="1"/>
    <ellipse cx="100" cy="226" rx="6" ry="5" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="1"/>

    <!-- ===================== -->
    <!--  RIBCAGE              -->
    <!-- ===================== -->
    <g id="ribcage">
      <!-- central sternum -->
      <ellipse cx="100" cy="210" rx="8" ry="22" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="1.5"/>
      <!-- ribs - left side, 4 pairs, rubber hose curves -->
      <path d="M92 198 Q72 196 70 206 Q72 216 92 214" fill="none" stroke="#c8c8c8" stroke-width="5" stroke-linecap="round"/>
      <path d="M92 205 Q68 203 66 213 Q68 223 92 220" fill="none" stroke="#c8c8c8" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M92 212 Q70 212 68 220 Q70 228 92 226" fill="none" stroke="#c8c8c8" stroke-width="4" stroke-linecap="round"/>
      <path d="M92 219 Q73 220 72 227 Q74 233 92 231" fill="none" stroke="#c0c0c0" stroke-width="3.5" stroke-linecap="round"/>
      <!-- ribs - right side -->
      <path d="M108 198 Q128 196 130 206 Q128 216 108 214" fill="none" stroke="#c8c8c8" stroke-width="5" stroke-linecap="round"/>
      <path d="M108 205 Q132 203 134 213 Q132 223 108 220" fill="none" stroke="#c8c8c8" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M108 212 Q130 212 132 220 Q130 228 108 226" fill="none" stroke="#c8c8c8" stroke-width="4" stroke-linecap="round"/>
      <path d="M108 219 Q127 220 128 227 Q126 233 108 231" fill="none" stroke="#c0c0c0" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- ===================== -->
    <!--  LEFT ARM             -->
    <!-- ===================== -->
    <g id="arm-left">
      <!-- shoulder joint -->
      <circle cx="78" cy="192" r="9" fill="#c8c8c8" stroke="#1a1a1a" stroke-width="1.5"/>
      <!-- upper arm -->
      <ellipse id="la-upper" cx="66" cy="208" rx="7" ry="20" fill="#c8c8c8" stroke="#1a1a1a" stroke-width="1.5" transform="rotate(-15 66 208)" filter="url(#bone-glow)"/>
      <!-- elbow -->
      <circle cx="58" cy="224" r="7" fill="#d0d0d0" stroke="#1a1a1a" stroke-width="1.5"/>
      <!-- forearm -->
      <ellipse id="la-fore" cx="50" cy="240" rx="6" ry="18" fill="#c8c8c8" stroke="#1a1a1a" stroke-width="1.5" transform="rotate(-10 50 240)" filter="url(#bone-glow)"/>
      <!-- hand - rubber hose 3 finger blob -->
      <ellipse cx="44" cy="255" rx="10" ry="7" fill="#d0d0d0" stroke="#1a1a1a" stroke-width="1.5" transform="rotate(-20 44 255)"/>
      <ellipse cx="38" cy="250" rx="5" ry="4" fill="#d0d0d0" stroke="#1a1a1a" stroke-width="1"/>
      <ellipse cx="50" cy="258" rx="5" ry="4" fill="#d0d0d0" stroke="#1a1a1a" stroke-width="1"/>
    </g>

    <!-- ===================== -->
    <!--  RIGHT ARM            -->
    <!-- ===================== -->
    <g id="arm-right">
      <circle cx="122" cy="192" r="9" fill="#e0e0e0" stroke="#1a1a1a" stroke-width="1.5"/>
      <ellipse id="ra-upper" cx="134" cy="208" rx="7" ry="20" fill="#e0e0e0" stroke="#1a1a1a" stroke-width="1.5" transform="rotate(15 134 208)" filter="url(#bone-glow)"/>
      <circle cx="142" cy="224" r="7" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="1.5"/>
      <ellipse id="ra-fore" cx="150" cy="240" rx="6" ry="18" fill="#e0e0e0" stroke="#1a1a1a" stroke-width="1.5" transform="rotate(10 150 240)" filter="url(#bone-glow)"/>
      <ellipse cx="156" cy="255" rx="10" ry="7" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="1.5" transform="rotate(20 156 255)"/>
      <ellipse cx="162" cy="250" rx="5" ry="4" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="1"/>
      <ellipse cx="150" cy="258" rx="5" ry="4" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="1"/>
    </g>

    <!-- ===================== -->
    <!--  NECK                 -->
    <!-- ===================== -->
    <ellipse id="neck" cx="100" cy="178" rx="7" ry="10" fill="#c8c8c8" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- ===================== -->
    <!--  SKULL                -->
    <!-- ===================== -->
    <g id="skull">
      <!-- cranium - big round rubber hose style -->
      <ellipse cx="100" cy="148" rx="32" ry="34" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="2.5" filter="url(#bone-glow)"/>
      <!-- cheekbones -->
      <ellipse cx="76" cy="158" rx="10" ry="8" fill="#e0e0e0" stroke="#1a1a1a" stroke-width="1.5"/>
      <ellipse cx="124" cy="158" rx="10" ry="8" fill="#e0e0e0" stroke="#1a1a1a" stroke-width="1.5"/>
      <!-- jaw -->
      <path d="M76 162 Q100 178 124 162 Q118 172 100 174 Q82 172 76 162Z" fill="#d8d8d8" stroke="#1a1a1a" stroke-width="1.5"/>
      <!-- teeth - rubber hose style, slightly uneven -->
      <rect x="86" y="166" width="6" height="7" rx="2" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1"/>
      <rect x="94" y="167" width="6" height="7" rx="2" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1"/>
      <rect x="102" y="166" width="6" height="7" rx="2" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1"/>
      <rect x="110" y="167" width="5" height="6" rx="2" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1"/>
      <!-- LEFT EYE SOCKET - hollow, classic skull -->
      <ellipse cx="87" cy="148" rx="12" ry="13" fill="#0d0d0d" stroke="#1a1a1a" stroke-width="1.5"/>
      <!-- eye glint - tiny white dot for life -->
      <ellipse cx="84" cy="145" rx="3" ry="3" fill="#ffffff" opacity="0.15"/>
      <!-- RIGHT EYE SOCKET -->
      <ellipse cx="113" cy="148" rx="12" ry="13" fill="#0d0d0d" stroke="#1a1a1a" stroke-width="1.5"/>
      <ellipse cx="110" cy="145" rx="3" ry="3" fill="#ffffff" opacity="0.15"/>
      <!-- nose cavity -->
      <path d="M97 158 Q100 162 103 158 Q101 165 100 165 Q99 165 97 158Z" fill="#1a1a1a"/>
      <!-- brow ridge for expression -->
      <path d="M75 136 Q87 130 99 134" fill="none" stroke="#b0b0b0" stroke-width="3" stroke-linecap="round"/>
      <path d="M101 134 Q113 130 125 136" fill="none" stroke="#b0b0b0" stroke-width="3" stroke-linecap="round"/>
    </g>

  </g><!-- end skel-root -->
</svg>
